<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dungeon Buddies v0.2</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <h1>Dungeon Buddies</h1>
        <p class="subtitle">v0.2 mechanics skeleton · private 3-player chaos</p>
      </div>
      <div id="connection" class="pill">connecting…</div>
    </header>

    <main id="lobby" class="panel lobby-panel">
      <h2>Start or Join</h2>
      <p>This build is intentionally simple: one Render server, no React build, no accounts.</p>
      <label>Your name</label>
      <input id="nameInput" placeholder="Trey" maxlength="24" />
      <div class="row gap">
        <button id="createBtn" class="primary">Create Room</button>
      </div>
      <hr />
      <label>Room code</label>
      <input id="codeInput" placeholder="ABCDE" maxlength="5" />
      <button id="joinBtn">Join Room</button>
      <div id="lobbyToast" class="toast"></div>
    </main>

    <main id="game" class="game hidden">
      <section class="status-strip panel">
        <div>
          <div class="label">Room</div>
          <div id="roomCode" class="room-code">—</div>
        </div>
        <div>
          <div class="label">Phase</div>
          <div id="phaseText" class="phase">—</div>
        </div>
        <div>
          <div class="label">Active</div>
          <div id="activeText">—</div>
        </div>
        <div>
          <div class="label">Decks</div>
          <div id="deckText">—</div>
        </div>
      </section>

      <section id="players" class="players"></section>

      <section class="table-grid">
        <div class="panel center-panel">
          <h2 id="mainTitle">Waiting…</h2>
          <div id="mainArea"></div>
          <div id="actions" class="actions"></div>
        </div>

        <aside class="panel log-panel">
          <div class="tabs">
            <button class="tab active" data-tab="log">Log</button>
            <button class="tab" data-tab="chat">Chat</button>
          </div>
          <div id="logBox" class="scrollbox"></div>
          <div id="chatBox" class="scrollbox hidden"></div>
          <form id="chatForm" class="chat-form">
            <input id="chatInput" placeholder="Talk trash…" maxlength="240" />
            <button>Send</button>
          </form>
        </aside>
      </section>

      <section class="panel hand-panel">
        <div class="hand-header">
          <div>
            <h2>Your Hand</h2>
            <p id="handMeta">—</p>
          </div>
          <div id="selectedInfo" class="selected-info">Tap a card.</div>
        </div>
        <div id="hand" class="hand"></div>
      </section>
    </main>
  </div>

  <template id="cardTemplate">
    <button class="card">
      <div class="card-type"></div>
      <div class="card-name"></div>
      <div class="card-body"></div>
      <div class="card-meta"></div>
    </button>
  </template>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
